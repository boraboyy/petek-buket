<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Petek İçin Hazırlanıyor...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050208;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #f9f2fa;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .top-badge {
      position: fixed;
      top: clamp(22px, 4.5vh, 42px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(28, 14, 36, 0.55);
      border: 1px solid rgba(245, 200, 235, 0.22);
      backdrop-filter: blur(8px);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(248, 222, 242, 0.85);
      pointer-events: none;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ef08a;
      box-shadow: 0 0 10px #9ef08a;
      animation: blinkDot 2s ease-in-out infinite;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 0.4; transform: scale(0.88); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .ui-container {
      position: fixed;
      bottom: clamp(22px, 4.8vh, 48px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      width: min(92vw, 460px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
    }

    .main-title {
      font-size: clamp(1.65rem, 5.2vw, 2.3rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.25;
      color: rgba(255, 248, 255, 0.96);
      text-shadow: 0 0 24px rgba(245, 195, 235, 0.35), 0 2px 10px rgba(0, 0, 0, 0.9);
      margin-bottom: 10px;
    }

    .sub-ticker {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(0.82rem, 2.8vw, 0.92rem);
      font-weight: 300;
      color: rgba(235, 208, 232, 0.78);
      min-height: 1.5em;
      letter-spacing: 0.02em;
      transition: opacity 0.45s ease, transform 0.45s ease;
      margin-bottom: 14px;
    }

    .sub-ticker.fade-out {
      opacity: 0;
      transform: translateY(5px);
    }

    .progress-wrap {
      width: min(74vw, 280px);
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #95e686, #f5b2df, #fff2fa);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(245, 178, 223, 0.8);
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    .water-btn {
      pointer-events: auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 999px;
      border: 1px solid rgba(248, 205, 238, 0.32);
      background: linear-gradient(135deg, rgba(45, 20, 56, 0.65), rgba(22, 10, 30, 0.78));
      color: rgba(255, 245, 255, 0.92);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55), 0 0 18px rgba(235, 165, 220, 0.14);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      margin-bottom: 14px;
    }

    .water-btn:hover {
      border-color: rgba(255, 220, 248, 0.65);
      box-shadow: 0 4px 24px rgba(235, 165, 220, 0.28);
      transform: translateY(-1px);
    }

    .water-btn:active {
      transform: scale(0.95);
    }

    .signature {
      font-size: clamp(1.1rem, 3.6vw, 1.35rem);
      font-style: italic;
      font-weight: 300;
      color: rgba(245, 225, 245, 0.62);
      letter-spacing: 0.06em;
    }

    .floating-toast {
      position: fixed;
      z-index: 5;
      pointer-events: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      color: rgba(255, 245, 255, 0.92);
      background: rgba(38, 18, 48, 0.72);
      border: 1px solid rgba(255, 215, 245, 0.28);
      padding: 5px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
      animation: floatUpFade 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.9); }
      20% { opacity: 1; transform: translate(-50%, -12px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -44px) scale(0.96); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="top-badge">
    <span class="status-dot"></span>
    <span>Özel Sera Bakımda</span>
  </div>

  <div class="ui-container">
    <h1 class="main-title" id="main-title">Petek için en taze çiçekler tedarik ediliyor...</h1>
    <div class="sub-ticker" id="sub-ticker">🌱 Toprak sevgiyle havalandırılıyor...</div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <button class="water-btn" id="water-btn" type="button">
      <span>💧</span>
      <span id="water-btn-text">Filize Can Suyu Ver</span>
    </button>

    <div class="signature">Bora'dan Petek'e</div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const subTicker = document.getElementById('sub-ticker');
      const progressBar = document.getElementById('progress-bar');
      const waterBtn = document.getElementById('water-btn');
      const waterBtnText = document.getElementById('water-btn-text');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const STATUS_MESSAGES = [
        '🌱 Toprak sevgiyle havalandırılıyor...',
        '🌷 Seralardan en nadide tohumlar seçiliyor...',
        '💧 Yapraklara sabah çiyi damlatılıyor...',
        '✨ Taç yaprakların yıldız tozu parıltısı ayarlanıyor...',
        '🎀 Buket kurdelesi Bora tarafından özenle bağlanıyor...',
        '🌙 Gece serasında sıcaklık sabitleniyor...',
        '🌸 Çok yakında sadece Petek için yeniden çiçek açacak...'
      ];

      const WATER_REACTIONS = [
        '💧 +1 Can suyu eklendi, filiz keyiflendi!',
        '🌱 Kökler biraz daha güçlendi...',
        '✨ Yapraklar parıldamaya başladı!',
        '🌸 Bora şu an harıl harıl yeni sürprizi hazırlıyor...',
        '💖 Sevgi dozu artırıldı!',
        '🌷 Gonca açmak için sabırsızlanıyor...'
      ];

      let msgIndex = 0;
      let waterCount = 0;
      let growthBonus = 0;
      let targetGrowthBonus = 0;
      let domeGlowPulse = 0;

      setInterval(() => {
        subTicker.classList.add('fade-out');
        setTimeout(() => {
          msgIndex = (msgIndex + 1) % STATUS_MESSAGES.length;
          subTicker.textContent = STATUS_MESSAGES[msgIndex];
          subTicker.classList.remove('fade-out');
        }, 450);
      }, 3800);

      let audioCtx = null;
      let masterGain = null;
      const SCALE_NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 1046.50, 1174.66];

      function ensureAudio() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return Promise.resolve();

        if (!audioCtx) {
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.72;

          const delay = audioCtx.createDelay(1.0);
          delay.delayTime.value = 0.22;
          const fb = audioCtx.createGain();
          fb.gain.value = 0.34;
          const wet = audioCtx.createGain();
          wet.gain.value = 0.42;

          masterGain.connect(audioCtx.destination);
          masterGain.connect(delay);
          delay.connect(fb);
          fb.connect(delay);
          delay.connect(wet);
          wet.connect(audioCtx.destination);
        }

        try {
          const buf = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (_) {}

        if (audioCtx.state === 'suspended') {
          return audioCtx.resume();
        }
        return Promise.resolve();
      }

      function playWaterDropSound(noteIdx) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime + 0.01;

        const dropOsc = audioCtx.createOscillator();
        const dropGain = audioCtx.createGain();
        dropOsc.type = 'sine';
        dropOsc.frequency.setValueAtTime(380, now);
        dropOsc.frequency.exponentialRampToValueAtTime(980, now + 0.09);

        dropGain.gain.setValueAtTime(0.001, now);
        dropGain.gain.linearRampToValueAtTime(0.16, now + 0.015);
        dropGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

        dropOsc.connect(dropGain);
        dropGain.connect(masterGain);
        dropOsc.start(now);
        dropOsc.stop(now + 0.16);

        const freq = SCALE_NOTES[noteIdx % SCALE_NOTES.length];
        const chimeOsc = audioCtx.createOscillator();
        const chimeGain = audioCtx.createGain();
        chimeOsc.type = 'sine';
        chimeOsc.frequency.setValueAtTime(freq, now + 0.06);

        chimeGain.gain.setValueAtTime(0.0001, now + 0.06);
        chimeGain.gain.linearRampToValueAtTime(0.14, now + 0.08);
        chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.9);

        chimeOsc.connect(chimeGain);
        chimeGain.connect(masterGain);
        chimeOsc.start(now + 0.06);
        chimeOsc.stop(now + 2.0);
      }

      let dewDrops = [];
      let soilSparkles = [];
      let fireflies = [];

      function initParticles() {
        fireflies = [];
        for (let i = 0; i < 65; i++) {
          fireflies.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.25,
            vy: -0.08 - Math.random() * 0.22,
            size: 0.9 + Math.random() * 1.9,
            alpha: 0.2 + Math.random() * 0.65,
            isGold: Math.random() < 0.45,
            isSquare: Math.random() < 0.2,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initParticles();
      }

      window.addEventListener('resize', resize);

      function spawnWaterDrops(domeX, domeTopY, domeRadius, soilY) {
        const dropCount = 7;
        for (let i = 0; i < dropCount; i++) {
          dewDrops.push({
            x: domeX + (Math.random() - 0.5) * domeRadius * 0.72,
            y: domeTopY + 24 + Math.random() * 25,
            vy: 1.4 + Math.random() * 1.6,
            targetY: soilY - 4 + (Math.random() - 0.5) * 10,
            size: 2.2 + Math.random() * 1.4,
            delay: i * 0.09
          });
        }
      }

      function showFloatingToast(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floating-toast';
        el.textContent = text;
        el.style.left = `${Math.min(width - 130, Math.max(130, x))}px`;
        el.style.top = `${Math.max(70, y - 20)}px`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1800);
      }

      let lastTapTime = 0;
      function triggerWatering(clientX, clientY) {
        const now = performance.now();
        if (now - lastTapTime < 260) return;
        lastTapTime = now;

        const domeX = width * 0.5;
        const domeCenterY = height * 0.41;
        const domeW = Math.min(width * 0.56, height * 0.29, 210);
        const domeH = domeW * 1.34;
        const domeTopY = domeCenterY - domeH * 0.52;
        const soilY = domeCenterY + domeH * 0.44;

        spawnWaterDrops(domeX, domeTopY, domeW * 0.5, soilY);

        const reaction = WATER_REACTIONS[waterCount % WATER_REACTIONS.length];
        waterCount++;
        targetGrowthBonus = Math.min(1.0, targetGrowthBonus + 0.14);
        domeGlowPulse = 1.0;

        const pct = Math.min(98, 35 + waterCount * 9);
        progressBar.style.width = `${pct}%`;
        waterBtnText.textContent = `Can Suyu Verildi (${waterCount}) ✨`;

        showFloatingToast(clientX || domeX, clientY || domeCenterY, reaction);

        ensureAudio().then(() => {
          playWaterDropSound(waterCount);
        });
      }

      waterBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        const t = e.changedTouches && e.changedTouches[0];
        triggerWatering(t ? t.clientX : width * 0.5, t ? t.clientY : height * 0.65);
      }, { passive: true });

      waterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerWatering(e.clientX, e.clientY);
      });

      window.addEventListener('touchstart', (e) => {
        if (e.target.closest('#water-btn')) return;
        const t = e.changedTouches && e.changedTouches[0];
        if (t) triggerWatering(t.clientX, t.clientY);
      }, { passive: true });

      window.addEventListener('click', (e) => {
        if (e.target.closest('#water-btn')) return;
        triggerWatering(e.clientX, e.clientY);
      });

      function render(now) {
        requestAnimationFrame(render);

        const t = now * 0.001;
        growthBonus += (targetGrowthBonus - growthBonus) * 0.04;
        domeGlowPulse *= 0.95;

        ctx.globalCompositeOperation = 'source-over';
        const bgGrad = ctx.createRadialGradient(width * 0.5, height * 0.42, 10, width * 0.5, height * 0.42, Math.max(width, height) * 0.75);
        bgGrad.addColorStop(0, '#170924');
        bgGrad.addColorStop(0.45, '#0b0412');
        bgGrad.addColorStop(1, '#040107');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        const cx = width * 0.5;
        const cy = height * 0.41;
        const domeRadius = Math.min(width * 0.28, height * 0.145, 106);
        const domeStraightH = domeRadius * 1.18;
        const baseY = cy + domeStraightH * 0.68;

        const auraRadius = domeRadius * (2.1 + growthBonus * 0.4 + domeGlowPulse * 0.25);
        const auraGrad = ctx.createRadialGradient(cx, cy - 10, 0, cx, cy - 10, auraRadius);
        auraGrad.addColorStop(0, `rgba(238, 148, 214, ${0.18 + growthBonus * 0.1 + domeGlowPulse * 0.12})`);
        auraGrad.addColorStop(0.5, 'rgba(158, 92, 205, 0.06)');
        auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = auraGrad;
        ctx.beginPath();
        ctx.arc(cx, cy - 10, auraRadius, 0, Math.PI * 2);
        ctx.fill();

        fireflies.forEach((p) => {
          p.x += p.vx + Math.sin(t * 0.8 + p.phase) * 0.1;
          p.y += p.vy;
          if (p.y < -10) p.y = height + 10;
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;

          const twinkle = 0.35 + 0.65 * Math.sin(t * 2.6 + p.phase);
          const alpha = p.alpha * twinkle;
          if (p.isSquare) {
            ctx.strokeStyle = p.isGold
              ? `rgba(255, 220, 140, ${alpha})`
              : `rgba(245, 210, 255, ${alpha})`;
            ctx.lineWidth = 0.75;
            ctx.strokeRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
          } else {
            ctx.fillStyle = p.isGold
              ? `rgba(255, 215, 125, ${alpha})`
              : `rgba(255, 238, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.beginPath();
        ctx.ellipse(cx, baseY + 14, domeRadius * 1.18, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        const baseGrad = ctx.createLinearGradient(cx - domeRadius * 1.1, baseY, cx + domeRadius * 1.1, baseY);
        baseGrad.addColorStop(0, '#241522');
        baseGrad.addColorStop(0.3, '#543546');
        baseGrad.addColorStop(0.5, '#7a5264');
        baseGrad.addColorStop(0.7, '#4c2f3f');
        baseGrad.addColorStop(1, '#1d101b');
        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.ellipse(cx, baseY + 6, domeRadius * 1.10, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 215, 148, 0.55)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(cx, baseY + 3, domeRadius * 1.06, 12, 0, 0, Math.PI * 2);
        ctx.stroke();

        const soilGrad = ctx.createRadialGradient(cx, baseY - 2, 4, cx, baseY, domeRadius * 0.95);
        soilGrad.addColorStop(0, '#466d3f');
        soilGrad.addColorStop(0.55, '#274225');
        soilGrad.addColorStop(1, '#132014');
        ctx.fillStyle = soilGrad;
        ctx.beginPath();
        ctx.ellipse(cx, baseY, domeRadius * 0.94, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        for (let m = 0; m < 18; m++) {
          const ang = (m / 18) * Math.PI * 2 + m;
          const dist = (0.2 + (m % 5) * 0.16) * domeRadius * 0.85;
          const mx = cx + Math.cos(ang) * dist;
          const my = baseY + Math.sin(ang) * 6;
          const mAlpha = 0.35 + 0.45 * Math.sin(t * 2.2 + m);
          ctx.fillStyle = `rgba(165, 238, 145, ${mAlpha})`;
          ctx.beginPath();
          ctx.arc(mx, my, 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        const sway = Math.sin(t * 1.3) * 3.2;
        const breathe = 1 + Math.sin(t * 2.1) * 0.035;
        const plantScale = (0.78 + growthBonus * 0.28) * breathe;
        const stemHeight = (domeStraightH * 0.82 + domeRadius * 0.42) * plantScale;

        const stemBase = { x: cx, y: baseY - 2 };
        const stemTip = { x: cx + sway, y: baseY - stemHeight };
        const cp1 = { x: cx - 10, y: baseY - stemHeight * 0.35 };
        const cp2 = { x: cx + 8 + sway * 0.5, y: baseY - stemHeight * 0.70 };

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(stemBase.x, stemBase.y);
        ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, stemTip.x, stemTip.y);
        ctx.strokeStyle = '#6ec462';
        ctx.lineWidth = 3.4;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(stemBase.x - 0.7, stemBase.y);
        ctx.bezierCurveTo(cp1.x - 0.7, cp1.y, cp2.x - 0.7, cp2.y, stemTip.x - 0.7, stemTip.y);
        ctx.strokeStyle = 'rgba(195, 248, 180, 0.65)';
        ctx.lineWidth = 1.0;
        ctx.stroke();

        const leafDefs = [
          { u: 0.24, dir: -1, len: 46 * plantScale, ang: -0.68 },
          { u: 0.38, dir:  1, len: 50 * plantScale, ang: -0.62 },
          { u: 0.55, dir: -1, len: 42 * plantScale, ang: -0.74 },
          { u: 0.68, dir:  1, len: 36 * plantScale, ang: -0.70 }
        ];

        leafDefs.forEach((lf, idx) => {
          const u = lf.u;
          const inv = 1 - u;
          const bx = inv*inv*inv*stemBase.x + 3*inv*inv*u*cp1.x + 3*inv*u*u*cp2.x + u*u*u*stemTip.x;
          const by = inv*inv*inv*stemBase.y + 3*inv*inv*u*cp1.y + 3*inv*u*u*cp2.y + u*u*u*stemTip.y;

          const leafSway = Math.sin(t * 1.6 + idx) * 2.0;
          const tipX = bx + lf.dir * Math.cos(lf.ang) * lf.len;
          const tipY = by + Math.sin(lf.ang + 0.3) * lf.len + leafSway;
          const ctrlX = bx + lf.dir * lf.len * 0.48;
          const ctrlY = by + Math.sin(lf.ang - 0.25) * lf.len * 0.55;

          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(ctrlX, ctrlY - 5.5, tipX, tipY);
          ctx.quadraticCurveTo(ctrlX, ctrlY + 5.5, bx, by + 3);
          ctx.closePath();

          const lGrad = ctx.createLinearGradient(bx, by, tipX, tipY);
          lGrad.addColorStop(0, 'rgba(62, 132, 55, 0.92)');
          lGrad.addColorStop(1, 'rgba(162, 228, 142, 0.78)');
          ctx.fillStyle = lGrad;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
          ctx.strokeStyle = 'rgba(195, 245, 178, 0.75)';
          ctx.lineWidth = 0.9;
          ctx.stroke();
        });

        ctx.save();
        ctx.translate(stemTip.x, stemTip.y);
        ctx.rotate(sway * 0.025);

        const budLen = (48 + growthBonus * 14) * breathe;
        const budW = (15 + growthBonus * 5) * breathe;
        const openAngle = 0.08 + growthBonus * 0.34;

        const budGlow = ctx.createRadialGradient(0, -budLen * 0.5, 2, 0, -budLen * 0.5, budLen * (1.2 + domeGlowPulse * 0.5));
        budGlow.addColorStop(0, `rgba(255, 195, 238, ${0.42 + domeGlowPulse * 0.35})`);
        budGlow.addColorStop(0.5, 'rgba(235, 135, 210, 0.14)');
        budGlow.addColorStop(1, 'rgba(235, 135, 210, 0)');
        ctx.fillStyle = budGlow;
        ctx.beginPath();
        ctx.arc(0, -budLen * 0.5, budLen * 1.4, 0, Math.PI * 2);
        ctx.fill();

        for (let side of [-1, 1]) {
          ctx.save();
          ctx.rotate(side * openAngle);
          const pGrad = ctx.createLinearGradient(0, 0, 0, -budLen * 0.96);
          pGrad.addColorStop(0, 'rgba(118, 195, 104, 0.92)');
          pGrad.addColorStop(0.35, 'rgba(232, 148, 204, 0.90)');
          pGrad.addColorStop(0.8, 'rgba(248, 205, 236, 0.94)');
          pGrad.addColorStop(1, 'rgba(255, 252, 255, 0.98)');

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-budW * 0.75, -budLen * 0.28, -budW * 0.55, -budLen * 0.75, side * 4 * growthBonus, -budLen * 0.96);
          ctx.bezierCurveTo(budW * 0.55, -budLen * 0.75, budW * 0.75, -budLen * 0.28, 0, 0);
          ctx.closePath();
          ctx.fillStyle = pGrad;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 250, 255, 0.88)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.restore();
        }

        const cGrad = ctx.createLinearGradient(0, 0, 0, -budLen);
        cGrad.addColorStop(0, 'rgba(105, 185, 92, 0.95)');
        cGrad.addColorStop(0.32, 'rgba(225, 128, 192, 0.94)');
        cGrad.addColorStop(0.75, 'rgba(248, 198, 232, 0.96)');
        cGrad.addColorStop(1, 'rgba(255, 252, 255, 1)');

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-budW, -budLen * 0.28, -budW * 0.82, -budLen * 0.76, 0, -budLen);
        ctx.bezierCurveTo(budW * 0.82, -budLen * 0.76, budW, -budLen * 0.28, 0, 0);
        ctx.closePath();
        ctx.fillStyle = cGrad;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 252, 255, 0.94)';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.lineTo(0, -budLen * 0.92);
        ctx.strokeStyle = 'rgba(218, 88, 168, 0.75)';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.restore();
        ctx.restore();

        for (let i = dewDrops.length - 1; i >= 0; i--) {
          const d = dewDrops[i];
          if (d.delay > 0) {
            d.delay -= 0.016;
            continue;
          }
          d.y += d.vy;
          d.vy += 0.08;

          ctx.save();
          ctx.fillStyle = 'rgba(185, 238, 255, 0.92)';
          ctx.beginPath();
          ctx.moveTo(d.x, d.y - d.size * 1.8);
          ctx.quadraticCurveTo(d.x + d.size, d.y, d.x, d.y + d.size);
          ctx.quadraticCurveTo(d.x - d.size, d.y, d.x, d.y - d.size * 1.8);
          ctx.fill();
          ctx.restore();

          if (d.y >= d.targetY) {
            for (let s = 0; s < 6; s++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 0.4 + Math.random() * 1.6;
              soilSparkles.push({
                x: d.x,
                y: d.targetY,
                vx: Math.cos(ang) * spd,
                vy: -Math.abs(Math.sin(ang) * spd) - 0.5,
                alpha: 0.95,
                size: 1.2 + Math.random() * 1.3
              });
            }
            dewDrops.splice(i, 1);
          }
        }

        for (let i = soilSparkles.length - 1; i >= 0; i--) {
          const sp = soilSparkles[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vy += 0.04;
          sp.alpha -= 0.025;
          if (sp.alpha <= 0) {
            soilSparkles.splice(i, 1);
            continue;
          }
          ctx.fillStyle = `rgba(210, 252, 220, ${sp.alpha})`;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.save();
        const archCenterY = baseY - domeStraightH;

        ctx.beginPath();
        ctx.moveTo(cx - domeRadius, baseY);
        ctx.lineTo(cx - domeRadius, archCenterY);
        ctx.arc(cx, archCenterY, domeRadius, Math.PI, 0, false);
        ctx.lineTo(cx + domeRadius, baseY);
        ctx.ellipse(cx, baseY, domeRadius, 10, 0, 0, Math.PI, false);
        ctx.closePath();

        const glassGrad = ctx.createLinearGradient(cx - domeRadius, cy, cx + domeRadius, cy);
        glassGrad.addColorStop(0, 'rgba(255, 240, 255, 0.11)');
        glassGrad.addColorStop(0.2, 'rgba(255, 240, 255, 0.03)');
        glassGrad.addColorStop(0.8, 'rgba(255, 240, 255, 0.02)');
        glassGrad.addColorStop(1, 'rgba(245, 210, 255, 0.13)');
        ctx.fillStyle = glassGrad;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 242, 255, 0.48)';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, archCenterY, domeRadius * 0.88, Math.PI * 1.08, Math.PI * 1.38, false);
        ctx.strokeStyle = 'rgba(255, 252, 255, 0.52)';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx - domeRadius * 0.88, archCenterY + 10);
        ctx.lineTo(cx - domeRadius * 0.88, baseY - 18);
        ctx.strokeStyle = 'rgba(255, 252, 255, 0.32)';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        const knobY = archCenterY - domeRadius - 10;
        const knobGrad = ctx.createRadialGradient(cx - 3, knobY - 3, 1, cx, knobY, 11);
        knobGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        knobGrad.addColorStop(0.5, 'rgba(245, 210, 250, 0.55)');
        knobGrad.addColorStop(1, 'rgba(215, 165, 235, 0.25)');
        ctx.fillStyle = knobGrad;
        ctx.beginPath();
        ctx.arc(cx, knobY, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 245, 255, 0.65)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.restore();
      }

      resize();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
