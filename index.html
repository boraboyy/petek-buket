
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bora'dan Petek'e</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Dancing+Script:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f3efe2;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      cursor: pointer;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Zarfın altındaki zarif tıklama ipucu */
    #tap-hint {
      position: fixed;
      top: calc(50% + 145px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      color: #8c7b65;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.1rem, 3.6vw, 1.35rem);
      font-style: italic;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 0.6s ease;
      white-space: nowrap;
      animation: gentleFloat 2.4s ease-in-out infinite;
    }

    #tap-hint.hidden {
      opacity: 0 !important;
      animation: none;
    }

    @keyframes gentleFloat {
      0%, 100% { opacity: 0.45; transform: translateX(-50%) translateY(0); }
      50% { opacity: 0.92; transform: translateX(-50%) translateY(-4px); }
    }

    /* Videonun sonundaki (00:11 - 00:13) minimal ve vurucu orta yazı */
    #outro-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -44%);
      z-index: 3;
      width: min(88vw, 460px);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.8s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #outro-container.visible {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .outro-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.65rem, 5.2vw, 2.35rem);
      font-style: italic;
      font-weight: 500;
      color: #3d352e;
      line-height: 1.28;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }

    .outro-sub {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(0.76rem, 2.5vw, 0.88rem);
      font-weight: 300;
      color: #8c8275;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="tap-hint">Adın Petek'se zarfa dokun</div>

  <div id="outro-container">
    <div class="outro-title" id="outro-title">Petek için en taze çiçekler tedarik ediliyor...</div>
    <div class="outro-sub" id="outro-sub">Bu sadece başlangıçtı • Bora'dan Petek'e</div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const tapHint = document.getElementById('tap-hint');
      const outroContainer = document.getElementById('outro-container');
      const outroTitle = document.getElementById('outro-title');
      const outroSub = document.getElementById('outro-sub');

      const params = new URLSearchParams(window.location.search);
      if (params.get('title')) outroTitle.textContent = params.get('title');
      if (params.get('sub')) outroSub.textContent = params.get('sub');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Animasyon durumları:
      // 'IDLE' -> Zarf kapalı bekliyor (hafif nefes alıyor)
      // 'PLAYING' -> Zarf açılıyor -> Mektup çıkıyor -> Çiçekler ekranı dolduruyor -> Çiçekler aşağı süzülüp yazıyı açıyor
      let state = 'IDLE';
      let startTime = 0;
      let outroShown = false;

      // ============================================================================
      // 1) MOBİL UYUMLU ESTETİK WEB AUDIO SES MOTORU
      // Mektup kağıdı hışırtısı + Kristal Arp & Müzik Kutusu Çiçeklenme Senfonisi
      // ============================================================================
      let audioCtx = null;
      let masterGain = null;
      let soundPlayed = false;

      function ensureAudioUnlocked() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return Promise.resolve();

        if (!audioCtx) {
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.75;

          const dry = audioCtx.createGain();
          dry.gain.value = 0.8;

          const delay1 = audioCtx.createDelay(1.0);
          delay1.delayTime.value = 0.18;
          const fb1 = audioCtx.createGain();
          fb1.gain.value = 0.34;

          const delay2 = audioCtx.createDelay(1.0);
          delay2.delayTime.value = 0.29;
          const fb2 = audioCtx.createGain();
          fb2.gain.value = 0.30;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 2600;

          const wet = audioCtx.createGain();
          wet.gain.value = 0.45;

          masterGain.connect(dry);
          dry.connect(audioCtx.destination);

          masterGain.connect(delay1);
          delay1.connect(fb1);
          fb1.connect(delay1);

          masterGain.connect(delay2);
          delay2.connect(fb2);
          fb2.connect(delay2);

          delay1.connect(filter);
          delay2.connect(filter);
          filter.connect(wet);
          wet.connect(audioCtx.destination);
        }

        try {
          const silent = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = silent;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (_) {}

        if (audioCtx.state === 'suspended') {
          return audioCtx.resume();
        }
        return Promise.resolve();
      }

      function playNote(freq, delaySec, vol = 0.14, dur = 2.4) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime + Math.max(0.005, delaySec);

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 2, now);

        const g1 = audioCtx.createGain();
        const g2 = audioCtx.createGain();

        g1.gain.setValueAtTime(0.0001, now);
        g1.gain.linearRampToValueAtTime(vol, now + 0.016);
        g1.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        g2.gain.setValueAtTime(0.0001, now);
        g2.gain.linearRampToValueAtTime(vol * 0.16, now + 0.012);
        g2.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.45);

        osc1.connect(g1);
        osc2.connect(g2);
        g1.connect(masterGain);
        g2.connect(masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + dur + 0.05);
        osc2.stop(now + dur * 0.5);
      }

      // Zarf açılırken hafif kağıt hışırtısı + ardından çiçeklerin fışkırış melodisi
      function playEnvelopeMusic() {
        if (!audioCtx || soundPlayed) return;
        soundPlayed = true;
        const now = audioCtx.currentTime;

        // 1) Zarif mektup zarfı açılış hışırtısı (yumuşak filtrelenmiş pembe gürültü)
        const bufLen = Math.floor(audioCtx.sampleRate * 0.35);
        const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) {
          const env = Math.sin((i / bufLen) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env * 0.12;
        }
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = noiseBuf;
        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.setValueAtTime(1200, now);
        bandpass.Q.value = 1.8;
        noiseSrc.connect(bandpass);
        bandpass.connect(masterGain);
        noiseSrc.start(now);

        // 2) Sıcak bahar akoru (Gmaj9 / Cmaj9 romantik müzik kutusu & arp serisi)
        const notes = [
          // Zarf açılırken (0.0s - 1.2s)
          { t: 0.08, f: 392.00, v: 0.13 }, // G4
          { t: 0.28, f: 493.88, v: 0.13 }, // B4
          { t: 0.50, f: 587.33, v: 0.14 }, // D5
          { t: 0.74, f: 739.99, v: 0.14 }, // F#5

          // Çiçekler zarftan taşmaya başlarken (1.1s - 3.5s)
          { t: 1.10, f: 783.99, v: 0.16 }, // G5
          { t: 1.32, f: 659.25, v: 0.14 }, // E5
          { t: 1.54, f: 783.99, v: 0.15 }, // G5
          { t: 1.76, f: 880.00, v: 0.16 }, // A5
          { t: 1.98, f: 987.77, v: 0.17 }, // B5
          { t: 2.22, f: 1174.66, v: 0.18 }, // D6
          { t: 2.50, f: 1046.50, v: 0.16 }, // C6
          { t: 2.78, f: 987.77, v: 0.15 }, // B5
          { t: 3.05, f: 880.00, v: 0.15 }, // A5
          { t: 3.35, f: 783.99, v: 0.16 }, // G5

          // Ekran tamamen çiçekle dolduğunda (3.7s - 5.5s)
          { t: 3.75, f: 659.25, v: 0.14 }, // E5
          { t: 4.05, f: 783.99, v: 0.15 }, // G5
          { t: 4.35, f: 987.77, v: 0.16 }, // B5
          { t: 4.68, f: 1174.66, v: 0.17 }, // D6
          { t: 5.05, f: 1318.51, v: 0.16 }, // E6
          { t: 5.45, f: 1567.98, v: 0.17 }, // G6

          // Çiçekler aşağı süzülüp yazı ortaya çıkarken (6.8s - 8.2s)
          { t: 6.80, f: 523.25, v: 0.13 }, // C5
          { t: 7.05, f: 659.25, v: 0.14 }, // E5
          { t: 7.30, f: 783.99, v: 0.15 }, // G5
          { t: 7.58, f: 987.77, v: 0.16 }, // B5
          { t: 7.90, f: 1174.66, v: 0.18 }  // D6
        ];

        notes.forEach((n) => playNote(n.f, n.t, n.v, 2.8));
      }

      // ============================================================================
      // 2) SULUBOYA (WATERCOLOR) ÇİÇEK SPRITE ÜRETİCİSİ
      // Videodaki (00:03 - 00:09) 8 farklı el boyaması suluboya çiçek türünü
      // yüksek çözünürlüklü offscreen canvas olarak önceden hazırlar.
      // ============================================================================
      const flowerSprites = [];

      function createWatercolorFlowerSprite(config) {
        const size = 180;
        const off = document.createElement('canvas');
        off.width = size;
        off.height = size;
        const octx = off.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;
        const R = size * 0.41;

        const {
          petalCount,
          innerColor,
          midColor,
          edgeColor,
          centerColor,
          stamenColor,
          petalWidthRatio,
          notched = false,
          doubleLayer = false,
          veinColor = 'rgba(180, 70, 110, 0.18)'
        } = config;

        const layers = doubleLayer ? [
          { scale: 1.0, rotOffset: 0, alpha: 0.92 },
          { scale: 0.74, rotOffset: Math.PI / petalCount, alpha: 0.95 }
        ] : [
          { scale: 1.0, rotOffset: 0, alpha: 0.94 }
        ];

        layers.forEach((layer) => {
          for (let i = 0; i < petalCount; i++) {
            const angle = (i / petalCount) * Math.PI * 2 + layer.rotOffset + (Math.sin(i * 7.3) * 0.04);
            const pLen = R * layer.scale * (0.94 + Math.cos(i * 3.7) * 0.06);
            const pW = pLen * petalWidthRatio;

            octx.save();
            octx.translate(cx, cy);
            octx.rotate(angle);

            // Suluboya taç yaprak yolu (uçları hafif dalgalı/çentikli doğal el çizimi form)
            octx.beginPath();
            octx.moveTo(0, 0);
            if (notched) {
              octx.bezierCurveTo(-pW * 0.65, -pLen * 0.28, -pW * 1.05, -pLen * 0.78, -pW * 0.35, -pLen * 0.98);
              octx.lineTo(-pW * 0.12, -pLen * 0.91);
              octx.lineTo(0, -pLen * 1.0);
              octx.lineTo(pW * 0.12, -pLen * 0.91);
              octx.lineTo(pW * 0.35, -pLen * 0.98);
              octx.bezierCurveTo(pW * 1.05, -pLen * 0.78, pW * 0.65, -pLen * 0.28, 0, 0);
            } else {
              octx.bezierCurveTo(-pW * 0.85, -pLen * 0.25, -pW * 0.95, -pLen * 0.82, 0, -pLen);
              octx.bezierCurveTo(pW * 0.95, -pLen * 0.82, pW * 0.85, -pLen * 0.25, 0, 0);
            }
            octx.closePath();

            // Suluboya pigment dağılımı (wet-on-wet radial/linear geçiş)
            const grad = octx.createRadialGradient(0, -pLen * 0.15, pLen * 0.04, 0, -pLen * 0.55, pLen * 0.92);
            grad.addColorStop(0, innerColor);
            grad.addColorStop(0.52, midColor);
            grad.addColorStop(0.88, edgeColor);
            grad.addColorStop(1, edgeColor);

            octx.globalAlpha = layer.alpha;
            octx.fillStyle = grad;
            octx.fill();

            // Suluboya su izi kenar birikimi (pigment pooling)
            octx.strokeStyle = edgeColor;
            octx.lineWidth = 1.1;
            octx.globalAlpha = 0.42;
            octx.stroke();

            // İnce fırça darbesi damar çizgileri
            octx.globalAlpha = 0.55;
            octx.strokeStyle = veinColor;
            octx.lineWidth = 0.85;
            for (let v = -1; v <= 1; v++) {
              octx.beginPath();
              octx.moveTo(0, -pLen * 0.08);
              octx.quadraticCurveTo(v * pW * 0.28, -pLen * 0.48, v * pW * 0.18, -pLen * 0.80);
              octx.stroke();
            }

            octx.restore();
          }
        });

        // Çiçek Göbeği (Yumuşak suluboya merkez + polen noktaları)
        const cGrad = octx.createRadialGradient(cx, cy, 1, cx, cy, R * 0.26);
        cGrad.addColorStop(0, centerColor);
        cGrad.addColorStop(0.65, centerColor);
        cGrad.addColorStop(1, 'rgba(255, 220, 130, 0)');
        octx.fillStyle = cGrad;
        octx.beginPath();
        octx.arc(cx, cy, R * 0.26, 0, Math.PI * 2);
        octx.fill();

        // Göbek etrafındaki ince stamen ve polen tomurcukları
        const stamenCount = 22;
        for (let s = 0; s < stamenCount; s++) {
          const a = (s / stamenCount) * Math.PI * 2 + (s % 2) * 0.1;
          const dist = R * (0.12 + (s % 3) * 0.055);
          const sx = cx + Math.cos(a) * dist;
          const sy = cy + Math.sin(a) * dist;

          octx.strokeStyle = 'rgba(165, 95, 45, 0.35)';
          octx.lineWidth = 0.75;
          octx.beginPath();
          octx.moveTo(cx + Math.cos(a) * R * 0.05, cy + Math.sin(a) * R * 0.05);
          octx.lineTo(sx, sy);
          octx.stroke();

          octx.fillStyle = stamenColor;
          octx.beginPath();
          octx.arc(sx, sy, 1.8, 0, Math.PI * 2);
          octx.fill();
        }

        return off;
      }

      function initFlowerSprites() {
        flowerSprites.length = 0;
        // 1. Pembe Suluboya Kozmos (Videonun ana pembe çiçeği)
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 8,
          innerColor: 'rgba(255, 232, 185, 0.92)',
          midColor: 'rgba(248, 168, 198, 0.86)',
          edgeColor: 'rgba(232, 108, 154, 0.90)',
          centerColor: 'rgba(245, 182, 65, 0.95)',
          stamenColor: '#d97724',
          petalWidthRatio: 0.44,
          notched: true,
          veinColor: 'rgba(205, 75, 128, 0.22)'
        }));

        // 2. Açık Toz Pembe / Beyaz Sakura & Bahar Çiçeği
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 6,
          innerColor: 'rgba(242, 152, 185, 0.88)',
          midColor: 'rgba(252, 212, 228, 0.85)',
          edgeColor: 'rgba(255, 245, 250, 0.92)',
          centerColor: 'rgba(248, 202, 95, 0.90)',
          stamenColor: '#e89b3c',
          petalWidthRatio: 0.56,
          notched: true,
          veinColor: 'rgba(218, 118, 158, 0.20)'
        }));

        // 3. Altın Sarısı / Kehribar Suluboya Papatya & Rudbeckia (Videodaki sarı çiçekler)
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 15,
          innerColor: 'rgba(218, 108, 38, 0.92)',
          midColor: 'rgba(252, 198, 68, 0.90)',
          edgeColor: 'rgba(255, 232, 125, 0.92)',
          centerColor: 'rgba(112, 58, 28, 0.95)',
          stamenColor: '#f5b841',
          petalWidthRatio: 0.26,
          notched: false,
          doubleLayer: true,
          veinColor: 'rgba(185, 92, 28, 0.22)'
        }));

        // 4. Mavi / Çivit Unutma Beni & Peygamber Çiçeği (Videodaki mavi çiçekler)
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 8,
          innerColor: 'rgba(245, 248, 255, 0.92)',
          midColor: 'rgba(132, 175, 235, 0.88)',
          edgeColor: 'rgba(72, 118, 198, 0.90)',
          centerColor: 'rgba(250, 212, 95, 0.92)',
          stamenColor: '#4a3520',
          petalWidthRatio: 0.45,
          notched: true,
          veinColor: 'rgba(52, 88, 165, 0.22)'
        }));

        // 5. Mercan / Kırmızı-Pembe Gelincik & Hibiskus
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 5,
          innerColor: 'rgba(168, 38, 78, 0.90)',
          midColor: 'rgba(238, 92, 118, 0.86)',
          edgeColor: 'rgba(252, 158, 168, 0.90)',
          centerColor: 'rgba(128, 28, 58, 0.95)',
          stamenColor: '#ffd166',
          petalWidthRatio: 0.68,
          notched: true,
          veinColor: 'rgba(155, 32, 68, 0.24)'
        }));

        // 6. Lavanta / Eflatun Yıldız Çiçeği (Aster)
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 12,
          innerColor: 'rgba(248, 225, 255, 0.90)',
          midColor: 'rgba(195, 148, 232, 0.86)',
          edgeColor: 'rgba(152, 102, 205, 0.88)',
          centerColor: 'rgba(245, 192, 78, 0.94)',
          stamenColor: '#c97a28',
          petalWidthRatio: 0.32,
          notched: false,
          doubleLayer: true,
          veinColor: 'rgba(128, 72, 178, 0.22)'
        }));

        // 7. Şeftali / Kayısı Tonlu Katmerli Çiçek
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 9,
          innerColor: 'rgba(255, 228, 145, 0.92)',
          midColor: 'rgba(252, 168, 132, 0.88)',
          edgeColor: 'rgba(242, 118, 128, 0.88)',
          centerColor: 'rgba(235, 158, 52, 0.94)',
          stamenColor: '#9e4720',
          petalWidthRatio: 0.46,
          notched: true,
          doubleLayer: true,
          veinColor: 'rgba(205, 88, 78, 0.20)'
        }));

        // 8. Saf Beyaz / Krem Papatya
        flowerSprites.push(createWatercolorFlowerSprite({
          petalCount: 14,
          innerColor: 'rgba(245, 238, 210, 0.92)',
          midColor: 'rgba(255, 252, 246, 0.94)',
          edgeColor: 'rgba(242, 225, 235, 0.90)',
          centerColor: 'rgba(242, 185, 58, 0.96)',
          stamenColor: '#d48422',
          petalWidthRatio: 0.28,
          notched: false,
          veinColor: 'rgba(210, 195, 185, 0.22)'
        }));
      }

      // ============================================================================
      // 3) ÇİÇEK PATLAMASI VE EKRANI DOLDURMA PARÇACIK SİSTEMİ
      // ============================================================================
      let bloomFlowers = [];

      function buildBloomFlowers() {
        bloomFlowers = [];
        const cx = width * 0.5;
        const cy = height * 0.5;
        const maxDist = Math.hypot(width * 0.56, height * 0.56);

        // Toplam 250 suluboya çiçek:
        // İlk dalga (0.85s - 2.0s): Zarftan dışarı taşan merkez buket (00:03 - 00:04)
        // İkinci dalga (1.6s - 3.9s): Tüm ekranı köşelere kadar dolduran çiçek denizi (00:05 - 00:09)
        const totalFlowers = 250;
        for (let i = 0; i < totalFlowers; i++) {
          const progress = i / totalFlowers;
          // Golden angle spiral dağılımı + doğal jitter ile ekranın her yerini homojen doldurur
          const goldenAngle = i * 2.399963229728653;
          const normRadius = Math.pow(progress, 0.62);
          const dist = normRadius * maxDist * (0.88 + Math.random() * 0.22);

          const targetX = cx + Math.cos(goldenAngle) * dist;
          const targetY = cy + Math.sin(goldenAngle) * dist;

          // Zarfın içinden (cx, cy) başlayıp kendi hedef noktasına doğru açılır
          const startX = cx + (Math.random() - 0.5) * 90;
          const startY = cy + (Math.random() - 0.5) * 55;

          const appearDelay = 0.82 + Math.pow(progress, 0.88) * 2.85 + Math.random() * 0.25;
          const baseSize = (54 + Math.random() * 58) * Math.min(1.15, Math.max(0.82, Math.min(width, height) / 430));

          // 00:10 - 00:12 arasında çiçekler aşağı doğru zarifçe süzülerek kaybolur
          const fadeOutDelay = 6.1 + ((targetY / height) * 0.9) + Math.random() * 0.65;

          bloomFlowers.push({
            spriteIdx: i % flowerSprites.length,
            startX,
            startY,
            targetX,
            targetY,
            size: baseSize,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.18,
            appearDelay,
            fadeOutDelay,
            fallVy: 28 + Math.random() * 45,
            fallVx: (Math.random() - 0.5) * 18,
            swayPhase: Math.random() * Math.PI * 2
          });
        }
      }

      // ============================================================================
      // 4) VINTAGE SULUBOYA ZARF, MÜHÜR VE MEKTUP ÇİZİMİ (00:01 - 00:03)
      // ============================================================================
      function drawBotanicalSprig(ctx, x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Sol ve sağ yeşil yaprak dalları
        ctx.strokeStyle = 'rgba(92, 128, 88, 0.85)';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';

        // Sağ yapraklı dal
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.quadraticCurveTo(14, -4, 34, -22);
        ctx.stroke();

        const rightLeaves = [
          { lx: 10, ly: 3, ang: -0.3, s: 1 },
          { lx: 18, ly: -6, ang: -1.1, s: 0.95 },
          { lx: 22, ly: -10, ang: -0.2, s: 0.9 },
          { lx: 29, ly: -17, ang: -1.0, s: 0.8 },
          { lx: 34, ly: -22, ang: -0.5, s: 0.75 }
        ];
        rightLeaves.forEach((lf) => {
          ctx.save();
          ctx.translate(lf.lx, lf.ly);
          ctx.rotate(lf.ang);
          ctx.scale(lf.s, lf.s);
          ctx.fillStyle = 'rgba(108, 148, 102, 0.78)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(6, -5, 14, 0);
          ctx.quadraticCurveTo(6, 5, 0, 0);
          ctx.fill();
          ctx.restore();
        });

        // Sol lavanta/mavi tomurcuklu dal
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.quadraticCurveTo(-12, -2, -24, -18);
        ctx.stroke();

        const leftDots = [
          { dx: -10, dy: 2, c: 'rgba(138, 118, 168, 0.85)' },
          { dx: -15, dy: -4, c: 'rgba(158, 128, 182, 0.85)' },
          { dx: -12, dy: -9, c: 'rgba(122, 138, 178, 0.85)' },
          { dx: -20, dy: -11, c: 'rgba(168, 132, 188, 0.85)' },
          { dx: -18, dy: -16, c: 'rgba(138, 118, 168, 0.85)' },
          { dx: -24, dy: -18, c: 'rgba(178, 142, 195, 0.85)' }
        ];
        leftDots.forEach((d) => {
          ctx.fillStyle = d.c;
          ctx.beginPath();
          ctx.arc(d.dx, d.dy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // Merkez pembe çan çiçekleri (Zambak / Lily of the valley dalı)
        ctx.beginPath();
        ctx.moveTo(0, 16);
        ctx.quadraticCurveTo(-2, -10, 4, -36);
        ctx.stroke();

        const bells = [
          { bx: -5, by: -12, ang: -0.4 },
          { bx: 6,  by: -18, ang: 0.4 },
          { bx: -4, by: -26, ang: -0.35 },
          { bx: 6,  by: -32, ang: 0.35 },
          { bx: 2,  by: -38, ang: 0 }
        ];
        bells.forEach((b) => {
          ctx.save();
          ctx.translate(b.bx, b.by);
          ctx.rotate(b.ang);
          ctx.fillStyle = 'rgba(218, 132, 168, 0.85)';
          ctx.beginPath();
          ctx.moveTo(0, -4);
          ctx.bezierCurveTo(-5, -2, -5, 4, -3, 5);
          ctx.lineTo(3, 5);
          ctx.bezierCurveTo(5, 4, 5, -2, 0, -4);
          ctx.fill();
          ctx.restore();
        });

        // Dalın altındaki küçük pembe suluboya kalp/gül
        ctx.fillStyle = 'rgba(218, 112, 138, 0.88)';
        ctx.beginPath();
        ctx.arc(0, 14, 5.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(188, 72, 102, 0.65)';
        ctx.beginPath();
        ctx.arc(-1, 13, 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawWaxSeal(ctx, x, y, radius, half = 'full') {
        ctx.save();
        ctx.translate(x, y);
        if (half === 'top') {
          ctx.beginPath();
          ctx.rect(-radius * 1.4, -radius * 1.4, radius * 2.8, radius * 1.4);
          ctx.clip();
        } else if (half === 'bottom') {
          ctx.beginPath();
          ctx.rect(-radius * 1.4, 0, radius * 2.8, radius * 1.4);
          ctx.clip();
        }

        // Dış organik mum mühür kenarı
        const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, radius);
        grad.addColorStop(0, '#b59ec2');
        grad.addColorStop(0.65, '#967ea4');
        grad.addColorStop(1, '#755d84');

        ctx.fillStyle = grad;
        ctx.beginPath();
        const steps = 24;
        for (let i = 0; i <= steps; i++) {
          const a = (i / steps) * Math.PI * 2;
          const r = radius * (0.96 + Math.sin(i * 5) * 0.04);
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // İç çember kabartması
        ctx.strokeStyle = 'rgba(92, 70, 108, 0.65)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.68, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(235, 220, 245, 0.45)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.arc(-0.5, -0.5, radius * 0.68, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      function drawEnvelopeAndLetter(elapsed) {
        // Zarf çiçeklerin altında tamamen kaldıktan sonra (elapsed > 3.6s) çizmeye gerek yok
        if (elapsed > 3.6) return;

        const envAlpha = elapsed < 2.8 ? 1 : Math.max(0, 1 - (elapsed - 2.8) / 0.8);
        ctx.save();
        ctx.globalAlpha = envAlpha;

        const cx = width * 0.5;
        const cy = height * 0.5;
        const envW = Math.min(width * 0.62, 236);
        const envH = envW * 0.70;
        const left = cx - envW / 2;
        const right = cx + envW / 2;
        const top = cy - envH / 2;
        const bottom = cy + envH / 2;

        // Zarf henüz açılmadıysa çok hafif nefes alma hareketi
        const idleFloat = state === 'IDLE' ? Math.sin(performance.now() * 0.0025) * 3.5 : 0;
        ctx.translate(0, idleFloat);

        // Kapak açılma ilerlemesi (0.0s -> 0.75s): 0 (kapalı, aşağı doğru) -> 1 (tam açık, yukarı doğru)
        const flapProg = state === 'IDLE' ? 0 : Math.min(1, elapsed / 0.72);
        const easeFlap = 1 - Math.pow(1 - flapProg, 3);

        // Mektup kartının zarftan yukarı çıkışı (0.35s -> 1.15s)
        const letterProg = state === 'IDLE' ? 0 : Math.min(1, Math.max(0, (elapsed - 0.32) / 0.82));
        const easeLetter = 1 - Math.pow(1 - letterProg, 3);

        // Hafif zarf gölgesi
        ctx.fillStyle = 'rgba(120, 102, 78, 0.14)';
        ctx.beginPath();
        ctx.roundRect(left + 3, top + 6, envW, envH, 5);
        ctx.fill();

        // 1) Zarf Arka İç Yüzeyi
        ctx.fillStyle = '#d8c5a8';
        ctx.beginPath();
        ctx.roundRect(left, top, envW, envH, 4);
        ctx.fill();

        // 2) Eğer kapak yarıdan fazla açıldıysa ÜSTTE Açık Üçgen Kapağı Çiz (00:02)
        const flapTipClosedY = cy + envH * 0.16;
        const flapTipOpenY = top - envH * 0.54;
        const currentFlapTipY = flapTipClosedY + (flapTipOpenY - flapTipClosedY) * easeFlap;

        if (easeFlap > 0.48) {
          ctx.save();
          const openFlapGrad = ctx.createLinearGradient(cx, top, cx, currentFlapTipY);
          openFlapGrad.addColorStop(0, '#dfcfb6');
          openFlapGrad.addColorStop(1, '#ece0cc');
          ctx.fillStyle = openFlapGrad;

          ctx.beginPath();
          ctx.moveTo(left, top);
          ctx.quadraticCurveTo(cx - envW * 0.22, (top + currentFlapTipY) * 0.5, cx, currentFlapTipY);
          ctx.quadraticCurveTo(cx + envW * 0.22, (top + currentFlapTipY) * 0.5, right, top);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = 'rgba(168, 145, 115, 0.55)';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          // Kapak ucundaki kırılmış mum mühürün üst yarısı (00:02)
          drawWaxSeal(ctx, cx, currentFlapTipY + 12, 15, 'bottom');
          ctx.restore();
        }

        // 3) Zarfın İçinden Yükselen El Yazısı Mektup Kartı (00:02 - 00:03)
        if (easeLetter > 0.01) {
          const cardW = envW * 0.88;
          const cardH = envH * 0.92;
          const cardX = cx - cardW / 2;
          const cardY = top - easeLetter * (envH * 0.32) + 8;

          ctx.save();
          // Mektup kağıdı (eskitilmiş krem parşömen)
          const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
          cardGrad.addColorStop(0, '#f7f2e7');
          cardGrad.addColorStop(1, '#e8dcc8');
          ctx.fillStyle = cardGrad;

          ctx.beginPath();
          ctx.roundRect(cardX, cardY, cardW, cardH, 3);
          ctx.fill();

          ctx.strokeStyle = 'rgba(175, 152, 122, 0.48)';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Mektup üzerindeki zarif el yazısı satırları (videodaki 00:02 kaligrafisi)
          ctx.fillStyle = 'rgba(135, 118, 98, 0.72)';
          ctx.font = `italic ${Math.round(envW * 0.062)}px "Dancing Script", "Cormorant Garamond", serif`;
          ctx.textAlign = 'center';
          ctx.fillText('Sevgili Petek, senin için', cx, cardY + 24);
          ctx.fillText('en taze çiçekler seçiliyor...', cx, cardY + 42);

          // Mektup üzerindeki suluboya çiçek dalı illüstrasyonu
          drawBotanicalSprig(ctx, cx, cardY + 86, envW / 230);
          ctx.restore();
        }

        // 4) Zarfın Sol, Sağ ve Alt Katlama Kanatları (Cep Kısmı)
        // Sol kanat
        const sideGradL = ctx.createLinearGradient(left, cy, cx, cy);
        sideGradL.addColorStop(0, '#dfd0b8');
        sideGradL.addColorStop(1, '#d2be9f');
        ctx.fillStyle = sideGradL;
        ctx.beginPath();
        ctx.moveTo(left, top);
        ctx.lineTo(cx, cy + envH * 0.08);
        ctx.lineTo(left, bottom);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(162, 138, 108, 0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Sağ kanat
        const sideGradR = ctx.createLinearGradient(right, cy, cx, cy);
        sideGradR.addColorStop(0, '#dfd0b8');
        sideGradR.addColorStop(1, '#d2be9f');
        ctx.fillStyle = sideGradR;
        ctx.beginPath();
        ctx.moveTo(right, top);
        ctx.lineTo(cx, cy + envH * 0.08);
        ctx.lineTo(right, bottom);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Alt cep kanadı
        const botGrad = ctx.createLinearGradient(cx, cy, cx, bottom);
        botGrad.addColorStop(0, '#e8dac4');
        botGrad.addColorStop(1, '#d8c5a8');
        ctx.fillStyle = botGrad;
        ctx.beginPath();
        ctx.moveTo(left, bottom);
        ctx.quadraticCurveTo(cx - envW * 0.2, cy + envH * 0.02, cx, cy + envH * 0.02);
        ctx.quadraticCurveTo(cx + envW * 0.2, cy + envH * 0.02, right, bottom);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 5) Eğer kapak henüz kapalıysa veya açılıyorsa (easeFlap <= 0.48) ÜST KAPAK ÖNDE Çizilir (00:01)
        if (easeFlap <= 0.48) {
          ctx.save();
          const topFlapGrad = ctx.createLinearGradient(cx, top, cx, currentFlapTipY);
          topFlapGrad.addColorStop(0, '#efe5d4');
          topFlapGrad.addColorStop(1, '#dfd0b8');
          ctx.fillStyle = topFlapGrad;

          ctx.beginPath();
          ctx.moveTo(left, top);
          ctx.quadraticCurveTo(cx - envW * 0.22, (top + currentFlapTipY) * 0.55, cx, currentFlapTipY);
          ctx.quadraticCurveTo(cx + envW * 0.22, (top + currentFlapTipY) * 0.55, right, top);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(158, 134, 104, 0.55)';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          // Kapalı zarf kapağının üzerindeki suluboya çiçek dalı (00:01)
          ctx.save();
          const verticalScale = Math.max(0.1, 1 - easeFlap * 1.9);
          ctx.translate(cx, top + (currentFlapTipY - top) * 0.62);
          ctx.scale(1, verticalScale);
          drawBotanicalSprig(ctx, 0, 0, envW / 235);
          ctx.restore();

          // Tam mühür
          drawWaxSeal(ctx, cx, currentFlapTipY, 15, 'full');
          ctx.restore();
        } else {
          // Kapak açıldığında alt cep üzerinde kalan yarım mühür (00:02)
          drawWaxSeal(ctx, cx, flapTipClosedY, 15, 'full');
        }

        ctx.restore();
      }

      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function render(now) {
        requestAnimationFrame(render);

        // Vintage sıcak krem kağıt arka planı (#f3efe2)
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#f3efe2';
        ctx.fillRect(0, 0, width, height);

        const elapsed = state === 'PLAYING' ? (now - startTime) / 1000 : 0;

        // 1) Zarf ve Mektubu Çiz
        drawEnvelopeAndLetter(elapsed);

        // 2) Zarftan Fışkırıp Ekranı Dolduran Suluboya Çiçekleri Çiz (00:03 -> 00:11)
        if (state === 'PLAYING') {
          for (let i = 0; i < bloomFlowers.length; i++) {
            const fl = bloomFlowers[i];
            if (elapsed < fl.appearDelay) continue;

            // Açılma animasyonu (0.65 saniyede zarftan hedef konumuna büyüyerek yerleşir)
            const growT = Math.min(1, (elapsed - fl.appearDelay) / 0.68);
            const easePos = easeOutCubic(growT);
            const easeScale = easeOutBack(growT);

            // 6.1s sonrasında çiçeklerin aşağı doğru süzülerek erimesi (00:10 - 00:12)
            let fadeAlpha = Math.min(1, growT * 2.2);
            let fallOffsetY = 0;
            let fallOffsetX = 0;

            if (elapsed > fl.fadeOutDelay) {
              const fadeT = Math.min(1, (elapsed - fl.fadeOutDelay) / 1.65);
              fadeAlpha *= Math.pow(1 - fadeT, 1.6);
              fallOffsetY = fadeT * fadeT * fl.fallVy * 2.4;
              fallOffsetX = fadeT * fl.fallVx;
            }

            if (fadeAlpha <= 0.01) continue;

            const curX = fl.startX + (fl.targetX - fl.startX) * easePos + fallOffsetX + Math.sin(elapsed * 1.4 + fl.swayPhase) * 2.2;
            const curY = fl.startY + (fl.targetY - fl.startY) * easePos + fallOffsetY + Math.cos(elapsed * 1.2 + fl.swayPhase) * 2.2;
            const curSize = fl.size * Math.max(0, easeScale);
            const curRot = fl.rotation + elapsed * fl.rotSpeed;

            const sprite = flowerSprites[fl.spriteIdx];
            ctx.save();
            ctx.globalAlpha = fadeAlpha;
            ctx.translate(curX, curY);
            ctx.rotate(curRot);
            ctx.drawImage(sprite, -curSize / 2, -curSize / 2, curSize, curSize);
            ctx.restore();
          }

          // 6.7. saniyede (çiçekler erirken) ortadaki yazıyı çıkar (00:11 - 00:13)
          if (elapsed > 6.65 && !outroShown) {
            outroShown = true;
            outroContainer.classList.add('visible');
          }
        }
      }

      let lastTap = 0;
      function triggerInteraction() {
        const now = performance.now();
        if (now - lastTap < 300) return;
        lastTap = now;

        const unlockPromise = ensureAudioUnlocked();

        if (state === 'IDLE') {
          state = 'PLAYING';
          startTime = now;
          tapHint.classList.add('hidden');
          if (unlockPromise) {
            unlockPromise.then(playEnvelopeMusic).catch(playEnvelopeMusic);
          } else {
            playEnvelopeMusic();
          }
        } else if (outroShown && (now - startTime) > 8500) {
          // Bittikten sonra tekrar dokunursa baştan oynatır
          state = 'IDLE';
          outroShown = false;
          soundPlayed = false;
          outroContainer.classList.remove('visible');
          tapHint.classList.remove('hidden');
        }
      }

      window.addEventListener('touchstart', () => {
        triggerInteraction();
      }, { passive: true });

      window.addEventListener('touchend', () => {
        ensureAudioUnlocked().then(() => {
          if (state === 'PLAYING' && !soundPlayed) playEnvelopeMusic();
        });
      }, { passive: true });

      window.addEventListener('click', () => {
        triggerInteraction();
      });

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (flowerSprites.length === 0) {
          initFlowerSprites();
        }
        buildBloomFlowers();
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
