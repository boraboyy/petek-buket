<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bora'dan Petek'e</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f3efe2;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      cursor: pointer;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Girişte zarfın altındaki zarif yazı (İmla kurallarına tam uyumlu) */
    #tap-hint {
      position: fixed;
      top: calc(50% + 145px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      color: #8c7b65;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.15rem, 3.8vw, 1.4rem);
      font-style: italic;
      letter-spacing: 0.06em;
      pointer-events: none;
      transition: opacity 0.6s ease;
      white-space: nowrap;
      animation: gentleFloat 2.4s ease-in-out infinite;
    }

    #tap-hint.hidden {
      opacity: 0 !important;
      animation: none;
    }

    @keyframes gentleFloat {
      0%, 100% { opacity: 0.48; transform: translateX(-50%) translateY(0); }
      50% { opacity: 0.95; transform: translateX(-50%) translateY(-4px); }
    }

    /* Çiçekler süzülüp açıldığında tam ortada beliren tek ve sade yazı */
    #outro-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -44%);
      z-index: 3;
      width: min(88vw, 480px);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.8s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #outro-container.visible {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .outro-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.1rem, 6.5vw, 3.1rem);
      font-style: italic;
      font-weight: 500;
      color: #3d352e;
      line-height: 1.25;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="tap-hint">Adın Petek'se dokun</div>

  <div id="outro-container">
    <div class="outro-title" id="outro-title">Bora'dan Petek'e</div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const tapHint = document.getElementById('tap-hint');
      const outroContainer = document.getElementById('outro-container');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Animasyon durumları:
      // 'IDLE' -> Zarf kapalı bekliyor
      // 'PLAYING' -> Zarf açılıyor -> Mektup çıkıyor -> 420 Lilium ve Lale ekranı dolduruyor -> Aşağı süzülüp "Bora'dan Petek'e" yazısını açıyor
      let state = 'IDLE';
      let startTime = 0;
      let outroShown = false;

      // ============================================================================
      // 1) MOBİL UYUMLU ESTETİK WEB AUDIO SES MOTORU
      // Mektup kağıdı hışırtısı + Kristal Arp & Müzik Kutusu Çiçeklenme Senfonisi
      // ============================================================================
      let audioCtx = null;
      let masterGain = null;
      let soundPlayed = false;

      function ensureAudioUnlocked() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return Promise.resolve();

        if (!audioCtx) {
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.75;

          const dry = audioCtx.createGain();
          dry.gain.value = 0.8;

          const delay1 = audioCtx.createDelay(1.0);
          delay1.delayTime.value = 0.18;
          const fb1 = audioCtx.createGain();
          fb1.gain.value = 0.34;

          const delay2 = audioCtx.createDelay(1.0);
          delay2.delayTime.value = 0.29;
          const fb2 = audioCtx.createGain();
          fb2.gain.value = 0.30;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 2600;

          const wet = audioCtx.createGain();
          wet.gain.value = 0.45;

          masterGain.connect(dry);
          dry.connect(audioCtx.destination);

          masterGain.connect(delay1);
          delay1.connect(fb1);
          fb1.connect(delay1);

          masterGain.connect(delay2);
          delay2.connect(fb2);
          fb2.connect(delay2);

          delay1.connect(filter);
          delay2.connect(filter);
          filter.connect(wet);
          wet.connect(audioCtx.destination);
        }

        try {
          const silent = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = silent;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (_) {}

        if (audioCtx.state === 'suspended') {
          return audioCtx.resume();
        }
        return Promise.resolve();
      }

      function playNote(freq, delaySec, vol = 0.14, dur = 2.4) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime + Math.max(0.005, delaySec);

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 2, now);

        const g1 = audioCtx.createGain();
        const g2 = audioCtx.createGain();

        g1.gain.setValueAtTime(0.0001, now);
        g1.gain.linearRampToValueAtTime(vol, now + 0.016);
        g1.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        g2.gain.setValueAtTime(0.0001, now);
        g2.gain.linearRampToValueAtTime(vol * 0.16, now + 0.012);
        g2.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.45);

        osc1.connect(g1);
        osc2.connect(g2);
        g1.connect(masterGain);
        g2.connect(masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + dur + 0.05);
        osc2.stop(now + dur * 0.5);
      }

      function playEnvelopeMusic() {
        if (!audioCtx || soundPlayed) return;
        soundPlayed = true;
        const now = audioCtx.currentTime;

        // 1) Zarif mektup zarfı açılış hışırtısı
        const bufLen = Math.floor(audioCtx.sampleRate * 0.35);
        const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) {
          const env = Math.sin((i / bufLen) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env * 0.12;
        }
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = noiseBuf;
        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.setValueAtTime(1200, now);
        bandpass.Q.value = 1.8;
        noiseSrc.connect(bandpass);
        bandpass.connect(masterGain);
        noiseSrc.start(now);

        // 2) Sıcak bahar akoru (Gmaj9 / Cmaj9 romantik müzik kutusu & arp serisi)
        const notes = [
          { t: 0.08, f: 392.00, v: 0.13 }, // G4
          { t: 0.28, f: 493.88, v: 0.13 }, // B4
          { t: 0.50, f: 587.33, v: 0.14 }, // D5
          { t: 0.74, f: 739.99, v: 0.14 }, // F#5

          { t: 1.10, f: 783.99, v: 0.16 }, // G5
          { t: 1.32, f: 659.25, v: 0.14 }, // E5
          { t: 1.54, f: 783.99, v: 0.15 }, // G5
          { t: 1.76, f: 880.00, v: 0.16 }, // A5
          { t: 1.98, f: 987.77, v: 0.17 }, // B5
          { t: 2.22, f: 1174.66, v: 0.18 }, // D6
          { t: 2.50, f: 1046.50, v: 0.16 }, // C6
          { t: 2.78, f: 987.77, v: 0.15 }, // B5
          { t: 3.05, f: 880.00, v: 0.15 }, // A5
          { t: 3.35, f: 783.99, v: 0.16 }, // G5

          { t: 3.75, f: 659.25, v: 0.14 }, // E5
          { t: 4.05, f: 783.99, v: 0.15 }, // G5
          { t: 4.35, f: 987.77, v: 0.16 }, // B5
          { t: 4.68, f: 1174.66, v: 0.17 }, // D6
          { t: 5.05, f: 1318.51, v: 0.16 }, // E6
          { t: 5.45, f: 1567.98, v: 0.17 }, // G6

          { t: 6.80, f: 523.25, v: 0.13 }, // C5
          { t: 7.05, f: 659.25, v: 0.14 }, // E5
          { t: 7.30, f: 783.99, v: 0.15 }, // G5
          { t: 7.58, f: 987.77, v: 0.16 }, // B5
          { t: 7.90, f: 1174.66, v: 0.18 }  // D6
        ];

        notes.forEach((n) => playNote(n.f, n.t, n.v, 2.8));
      }

      // ============================================================================
      // 2) SULUBOYA (WATERCOLOR) LILIUM (ZAMBAK) & LALE (TULIP) SPRITE ÜRETİCİSİ
      // ============================================================================
      const flowerSprites = [];

      // A) SULUBOYA LILIUM (ZAMBAK) ÜRETİCİSİ
      function createWatercolorLiliumSprite(config) {
        const size = 200;
        const off = document.createElement('canvas');
        off.width = size;
        off.height = size;
        const octx = off.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;
        const R = size * 0.44;

        const {
          throatColor,
          midColor,
          tipColor,
          edgeStroke,
          veinColor,
          freckleColor,
          antherColor,
          filamentColor
        } = config;

        const passes = [
          { indices: [1, 3, 5], widthMul: 0.36, lenMul: 0.96 },
          { indices: [0, 2, 4], widthMul: 0.43, lenMul: 1.00 }
        ];

        passes.forEach((pass) => {
          pass.indices.forEach((idx) => {
            const angle = (idx / 6) * Math.PI * 2 - Math.PI / 2 + Math.sin(idx * 4.1) * 0.03;
            const pLen = R * pass.lenMul;
            const pW = pLen * pass.widthMul;

            octx.save();
            octx.translate(cx, cy);
            octx.rotate(angle);

            octx.beginPath();
            octx.moveTo(0, 0);
            octx.bezierCurveTo(-pW * 0.42, -pLen * 0.16, -pW * 1.12, -pLen * 0.48, -pW * 0.48, -pLen * 0.80);
            octx.quadraticCurveTo(-pW * 0.16, -pLen * 0.94, 0, -pLen);
            octx.quadraticCurveTo(pW * 0.16, -pLen * 0.94, pW * 0.48, -pLen * 0.80);
            octx.bezierCurveTo(pW * 1.12, -pLen * 0.48, pW * 0.42, -pLen * 0.16, 0, 0);
            octx.closePath();

            const grad = octx.createLinearGradient(0, 0, 0, -pLen);
            grad.addColorStop(0, throatColor);
            grad.addColorStop(0.22, midColor);
            grad.addColorStop(0.72, midColor);
            grad.addColorStop(1, tipColor);

            octx.fillStyle = grad;
            octx.fill();

            const sideGrad = octx.createRadialGradient(0, -pLen * 0.42, pW * 0.05, 0, -pLen * 0.48, pW * 1.05);
            sideGrad.addColorStop(0, midColor);
            sideGrad.addColorStop(0.65, 'rgba(255,255,255,0)');
            sideGrad.addColorStop(1, tipColor);
            octx.fillStyle = sideGrad;
            octx.fill();

            octx.strokeStyle = edgeStroke;
            octx.lineWidth = 1.25;
            octx.stroke();

            octx.strokeStyle = veinColor;
            octx.lineWidth = 1.6;
            octx.beginPath();
            octx.moveTo(0, -pLen * 0.04);
            octx.lineTo(0, -pLen * 0.88);
            octx.stroke();

            octx.lineWidth = 0.75;
            octx.globalAlpha = 0.55;
            for (let side of [-1, 1]) {
              for (let v = 1; v <= 2; v++) {
                octx.beginPath();
                octx.moveTo(0, -pLen * (0.14 * v));
                octx.quadraticCurveTo(
                  side * pW * (0.32 * v),
                  -pLen * (0.35 + v * 0.12),
                  side * pW * (0.18 * v),
                  -pLen * (0.64 + v * 0.10)
                );
                octx.stroke();
              }
            }
            octx.globalAlpha = 1;

            octx.fillStyle = freckleColor;
            const spots = [
              [-0.18, 0.22, 1.5], [0.16, 0.25, 1.4], [-0.28, 0.31, 1.7],
              [0.26, 0.34, 1.6], [-0.12, 0.38, 1.3], [0.14, 0.41, 1.5],
              [-0.32, 0.45, 1.4], [0.30, 0.47, 1.4], [-0.19, 0.53, 1.2],
              [0.21, 0.55, 1.2], [0.0, 0.30, 1.3], [0.0, 0.46, 1.1]
            ];
            spots.forEach(([sx, sy, sr]) => {
              octx.beginPath();
              octx.ellipse(sx * pW, -sy * pLen, sr, sr * 1.35, sx * 0.6, 0, Math.PI * 2);
              octx.fill();
            });

            octx.restore();
          });
        });

        const centerGrad = octx.createRadialGradient(cx, cy, 1, cx, cy, R * 0.16);
        centerGrad.addColorStop(0, 'rgba(135, 178, 82, 0.90)');
        centerGrad.addColorStop(0.6, 'rgba(178, 208, 112, 0.55)');
        centerGrad.addColorStop(1, 'rgba(178, 208, 112, 0)');
        octx.fillStyle = centerGrad;
        octx.beginPath();
        octx.arc(cx, cy, R * 0.16, 0, Math.PI * 2);
        octx.fill();

        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
          const sLen = R * (0.42 + (i % 2) * 0.06);
          const curve = (i % 2 === 0 ? 1 : -1) * 0.18;
          const midX = cx + Math.cos(a + curve) * (sLen * 0.55);
          const midY = cy + Math.sin(a + curve) * (sLen * 0.55);
          const endX = cx + Math.cos(a) * sLen;
          const endY = cy + Math.sin(a) * sLen;

          octx.strokeStyle = filamentColor;
          octx.lineWidth = 1.35;
          octx.lineCap = 'round';
          octx.beginPath();
          octx.moveTo(cx, cy);
          octx.quadraticCurveTo(midX, midY, endX, endY);
          octx.stroke();

          octx.save();
          octx.translate(endX, endY);
          octx.rotate(a + Math.PI / 2 + 0.25);
          octx.fillStyle = antherColor;
          octx.beginPath();
          octx.ellipse(0, 0, 5.2, 1.9, 0, 0, Math.PI * 2);
          octx.fill();
          octx.strokeStyle = 'rgba(95, 35, 15, 0.45)';
          octx.lineWidth = 0.7;
          octx.stroke();
          octx.restore();
        }

        octx.strokeStyle = '#7da652';
        octx.lineWidth = 2.0;
        octx.beginPath();
        octx.moveTo(cx, cy);
        octx.quadraticCurveTo(cx + 4, cy - 10, cx + 8, cy - 22);
        octx.stroke();

        octx.fillStyle = '#6c9642';
        for (let k = 0; k < 3; k++) {
          const ka = (k / 3) * Math.PI * 2;
          octx.beginPath();
          octx.arc(cx + 8 + Math.cos(ka) * 2.4, cy - 22 + Math.sin(ka) * 2.4, 2.2, 0, Math.PI * 2);
          octx.fill();
        }

        return { canvas: off, type: 'lilium' };
      }

      // B) SULUBOYA LALE (TULIP) ÜRETİCİSİ
      function createWatercolorTulipSprite(config) {
        const size = 200;
        const off = document.createElement('canvas');
        off.width = size;
        off.height = size;
        const octx = off.getContext('2d');
        const cx = size / 2;
        const baseY = size * 0.68;
        const cupH = size * 0.50;
        const cupW = size * 0.36;

        const {
          baseColor,
          midColor,
          tipColor,
          innerDarkColor,
          edgeStroke,
          featherColor
        } = config;

        // 1) Zarif suluboya yeşil lale sapı ve yandan sarılan yaprağı
        octx.save();
        octx.strokeStyle = 'rgba(96, 136, 84, 0.88)';
        octx.lineWidth = 3.8;
        octx.lineCap = 'round';
        octx.beginPath();
        octx.moveTo(cx, baseY - 2);
        octx.quadraticCurveTo(cx - 3, baseY + 26, cx + 2, size * 0.94);
        octx.stroke();

        const leafGrad = octx.createLinearGradient(cx, baseY + 40, cx, baseY - 25);
        leafGrad.addColorStop(0, 'rgba(84, 122, 74, 0.86)');
        leafGrad.addColorStop(1, 'rgba(128, 166, 108, 0.82)');
        octx.fillStyle = leafGrad;

        octx.beginPath();
        octx.moveTo(cx - 1, baseY + 36);
        octx.bezierCurveTo(cx - 28, baseY + 18, cx - 36, baseY - 8, cx - 22, baseY - 30);
        octx.bezierCurveTo(cx - 24, baseY - 4, cx - 14, baseY + 14, cx - 1, baseY + 26);
        octx.closePath();
        octx.fill();

        octx.beginPath();
        octx.moveTo(cx + 1, baseY + 40);
        octx.bezierCurveTo(cx + 26, baseY + 20, cx + 34, baseY - 4, cx + 24, baseY - 24);
        octx.bezierCurveTo(cx + 22, baseY - 2, cx + 12, baseY + 16, cx + 1, baseY + 28);
        octx.closePath();
        octx.fill();
        octx.restore();

        // 2) Arka İki İç Lale Yaprağının Uçları
        [-1, 1].forEach((dir) => {
          octx.save();
          octx.fillStyle = innerDarkColor;
          octx.beginPath();
          octx.moveTo(cx, baseY - cupH * 0.25);
          octx.bezierCurveTo(
            cx + dir * cupW * 0.55, baseY - cupH * 0.65,
            cx + dir * cupW * 0.42, baseY - cupH * 0.98,
            cx + dir * cupW * 0.16, baseY - cupH * 1.03
          );
          octx.quadraticCurveTo(cx, baseY - cupH * 0.85, cx, baseY - cupH * 0.25);
          octx.closePath();
          octx.fill();
          octx.strokeStyle = edgeStroke;
          octx.lineWidth = 0.9;
          octx.stroke();
          octx.restore();
        });

        // 3) Yan Kadeh Yaprakları
        [-1, 1].forEach((dir) => {
          octx.save();
          octx.beginPath();
          octx.moveTo(cx, baseY);
          octx.bezierCurveTo(
            cx + dir * cupW * 0.96, baseY - cupH * 0.06,
            cx + dir * cupW * 0.92, baseY - cupH * 0.72,
            cx + dir * cupW * 0.38, baseY - cupH * 0.98
          );
          octx.bezierCurveTo(
            cx + dir * cupW * 0.10, baseY - cupH * 0.82,
            cx + dir * cupW * 0.06, baseY - cupH * 0.35,
            cx, baseY
          );
          octx.closePath();

          const sideGrad = octx.createLinearGradient(cx, baseY, cx + dir * cupW * 0.4, baseY - cupH);
          sideGrad.addColorStop(0, baseColor);
          sideGrad.addColorStop(0.55, midColor);
          sideGrad.addColorStop(1, tipColor);
          octx.fillStyle = sideGrad;
          octx.fill();

          octx.strokeStyle = featherColor;
          octx.lineWidth = 1.0;
          for (let f = 1; f <= 3; f++) {
            const t = f * 0.22;
            octx.beginPath();
            octx.moveTo(cx + dir * cupW * (0.12 * f), baseY - cupH * 0.12);
            octx.quadraticCurveTo(
              cx + dir * cupW * (0.28 + t * 0.45),
              baseY - cupH * 0.52,
              cx + dir * cupW * (0.22 + t * 0.22),
              baseY - cupH * (0.82 + f * 0.03)
            );
            octx.stroke();
          }

          octx.strokeStyle = edgeStroke;
          octx.lineWidth = 1.2;
          octx.stroke();
          octx.restore();
        });

        // 4) Ön Merkez Ana Kadeh Yaprağı
        octx.save();
        octx.beginPath();
        octx.moveTo(cx, baseY + 1);
        octx.bezierCurveTo(
          cx - cupW * 0.56, baseY - cupH * 0.08,
          cx - cupW * 0.48, baseY - cupH * 0.78,
          cx, baseY - cupH * 1.02
        );
        octx.bezierCurveTo(
          cx + cupW * 0.48, baseY - cupH * 0.78,
          cx + cupW * 0.56, baseY - cupH * 0.08,
          cx, baseY + 1
        );
        octx.closePath();

        const centerGrad = octx.createLinearGradient(cx, baseY, cx, baseY - cupH * 1.02);
        centerGrad.addColorStop(0, baseColor);
        centerGrad.addColorStop(0.48, midColor);
        centerGrad.addColorStop(0.88, tipColor);
        centerGrad.addColorStop(1, tipColor);
        octx.fillStyle = centerGrad;
        octx.fill();

        octx.strokeStyle = featherColor;
        octx.lineWidth = 1.05;
        [-0.22, -0.10, 0, 0.10, 0.22].forEach((offset) => {
          octx.beginPath();
          octx.moveTo(cx + cupW * offset * 0.4, baseY - cupH * 0.08);
          octx.quadraticCurveTo(
            cx + cupW * offset * 1.15,
            baseY - cupH * 0.52,
            cx + cupW * offset * 0.55,
            baseY - cupH * 0.90
          );
          octx.stroke();
        });

        octx.strokeStyle = edgeStroke;
        octx.lineWidth = 1.25;
        octx.stroke();

        const calyxGrad = octx.createRadialGradient(cx, baseY, 1, cx, baseY, 10);
        calyxGrad.addColorStop(0, 'rgba(116, 152, 92, 0.75)');
        calyxGrad.addColorStop(1, 'rgba(116, 152, 92, 0)');
        octx.fillStyle = calyxGrad;
        octx.beginPath();
        octx.arc(cx, baseY, 10, 0, Math.PI * 2);
        octx.fill();

        octx.restore();

        return { canvas: off, type: 'tulip' };
      }

      function initFlowerSprites() {
        flowerSprites.length = 0;

        // 1. Stargazer Pembe Lilium (Zambak)
        flowerSprites.push(createWatercolorLiliumSprite({
          throatColor: 'rgba(225, 238, 175, 0.95)',
          midColor: 'rgba(236, 118, 162, 0.90)',
          tipColor: 'rgba(255, 244, 248, 0.96)',
          edgeStroke: 'rgba(198, 72, 122, 0.55)',
          veinColor: 'rgba(185, 48, 98, 0.65)',
          freckleColor: 'rgba(162, 28, 75, 0.72)',
          antherColor: '#c85a28',
          filamentColor: 'rgba(235, 195, 198, 0.90)'
        }));

        // 2. Kraliyet Pembe / Gül Kurusu Lale (Tulip)
        flowerSprites.push(createWatercolorTulipSprite({
          baseColor: 'rgba(252, 235, 195, 0.94)',
          midColor: 'rgba(242, 134, 168, 0.92)',
          tipColor: 'rgba(255, 218, 232, 0.95)',
          innerDarkColor: 'rgba(198, 78, 118, 0.88)',
          edgeStroke: 'rgba(188, 68, 108, 0.52)',
          featherColor: 'rgba(205, 72, 118, 0.32)'
        }));

        // 3. Casablanca Beyaz & Krem Oryantal Lilium (Zambak)
        flowerSprites.push(createWatercolorLiliumSprite({
          throatColor: 'rgba(212, 232, 152, 0.94)',
          midColor: 'rgba(255, 252, 245, 0.95)',
          tipColor: 'rgba(248, 234, 238, 0.94)',
          edgeStroke: 'rgba(192, 168, 148, 0.52)',
          veinColor: 'rgba(188, 162, 125, 0.55)',
          freckleColor: 'rgba(198, 118, 135, 0.55)',
          antherColor: '#d47424',
          filamentColor: 'rgba(235, 238, 212, 0.92)'
        }));

        // 4. Yakut / Mercan Kırmızısı Osmanlı Lalesi (Tulip)
        flowerSprites.push(createWatercolorTulipSprite({
          baseColor: 'rgba(255, 218, 128, 0.94)',
          midColor: 'rgba(235, 82, 102, 0.92)',
          tipColor: 'rgba(252, 168, 172, 0.94)',
          innerDarkColor: 'rgba(172, 38, 62, 0.90)',
          edgeStroke: 'rgba(165, 35, 58, 0.55)',
          featherColor: 'rgba(255, 225, 148, 0.38)'
        }));

        // 5. Şeftali / Somon Asya Liliumu (Zambak)
        flowerSprites.push(createWatercolorLiliumSprite({
          throatColor: 'rgba(252, 218, 125, 0.94)',
          midColor: 'rgba(252, 162, 134, 0.90)',
          tipColor: 'rgba(255, 228, 212, 0.94)',
          edgeStroke: 'rgba(208, 98, 76, 0.52)',
          veinColor: 'rgba(196, 82, 62, 0.58)',
          freckleColor: 'rgba(158, 52, 38, 0.68)',
          antherColor: '#a8441e',
          filamentColor: 'rgba(248, 205, 168, 0.90)'
        }));

        // 6. Altın Sarısı & Kayısı Lale (Tulip)
        flowerSprites.push(createWatercolorTulipSprite({
          baseColor: 'rgba(225, 132, 42, 0.92)',
          midColor: 'rgba(252, 202, 74, 0.92)',
          tipColor: 'rgba(255, 238, 152, 0.95)',
          innerDarkColor: 'rgba(198, 108, 28, 0.88)',
          edgeStroke: 'rgba(188, 105, 32, 0.52)',
          featherColor: 'rgba(218, 95, 35, 0.32)'
        }));

        // 7. Lavanta / Eflatun Lilium (Zambak)
        flowerSprites.push(createWatercolorLiliumSprite({
          throatColor: 'rgba(232, 242, 178, 0.94)',
          midColor: 'rgba(198, 152, 228, 0.90)',
          tipColor: 'rgba(246, 235, 255, 0.95)',
          edgeStroke: 'rgba(148, 96, 188, 0.52)',
          veinColor: 'rgba(138, 78, 178, 0.60)',
          freckleColor: 'rgba(118, 48, 158, 0.68)',
          antherColor: '#c46c28',
          filamentColor: 'rgba(232, 212, 245, 0.90)'
        }));

        // 8. Leylak / Mor & Beyaz Kırçıllı Lale (Tulip)
        flowerSprites.push(createWatercolorTulipSprite({
          baseColor: 'rgba(248, 238, 255, 0.94)',
          midColor: 'rgba(182, 132, 218, 0.92)',
          tipColor: 'rgba(238, 218, 252, 0.95)',
          innerDarkColor: 'rgba(128, 76, 168, 0.88)',
          edgeStroke: 'rgba(122, 72, 162, 0.52)',
          featherColor: 'rgba(108, 52, 148, 0.34)'
        }));
      }

      // ============================================================================
      // 3) YOĞUN ÇİÇEK PATLAMASI VE EKRANI DOLDURMA SİSTEMİ (420 ÇİÇEK)
      // ============================================================================
      let bloomFlowers = [];

      function buildBloomFlowers() {
        bloomFlowers = [];
        const cx = width * 0.5;
        const cy = height * 0.5;
        const maxDist = Math.hypot(width * 0.58, height * 0.58);

        // Ekranın her noktasını boşluk bırakmadan yemyeşil/rengarenk dolduran 420 Lilium ve Lale
        const totalFlowers = 420;
        for (let i = 0; i < totalFlowers; i++) {
          const progress = i / totalFlowers;
          const goldenAngle = i * 2.399963229728653;
          const normRadius = Math.pow(progress, 0.58);
          const dist = normRadius * maxDist * (0.86 + Math.random() * 0.24);

          const targetX = cx + Math.cos(goldenAngle) * dist;
          const targetY = cy + Math.sin(goldenAngle) * dist;

          const startX = cx + (Math.random() - 0.5) * 95;
          const startY = cy + (Math.random() - 0.5) * 60;

          const appearDelay = 0.78 + Math.pow(progress, 0.86) * 2.95 + Math.random() * 0.25;
          const spriteIdx = i % flowerSprites.length;
          const spriteObj = flowerSprites[spriteIdx];
          const isTulip = spriteObj && spriteObj.type === 'tulip';

          const rotation = isTulip
            ? (Math.random() - 0.5) * 1.05 + ((targetX - cx) / Math.max(1, width)) * 0.35
            : Math.random() * Math.PI * 2;
          const rotSpeed = isTulip
            ? (Math.random() - 0.5) * 0.05
            : (Math.random() - 0.5) * 0.14;

          const baseSize = (64 + Math.random() * 66) * Math.min(1.18, Math.max(0.85, Math.min(width, height) / 420));
          const fadeOutDelay = 6.15 + ((targetY / height) * 0.9) + Math.random() * 0.65;

          bloomFlowers.push({
            spriteIdx,
            startX,
            startY,
            targetX,
            targetY,
            size: baseSize,
            rotation,
            rotSpeed,
            appearDelay,
            fadeOutDelay,
            fallVy: 28 + Math.random() * 45,
            fallVx: (Math.random() - 0.5) * 18,
            swayPhase: Math.random() * Math.PI * 2
          });
        }
      }

      // ============================================================================
      // 4) VINTAGE SULUBOYA ZARF, MÜHÜR VE MEKTUP ÇİZİMİ
      // ============================================================================
      function drawBotanicalSprig(ctx, x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.strokeStyle = 'rgba(92, 128, 88, 0.85)';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';

        // Sağ yapraklı dal
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.quadraticCurveTo(14, -4, 34, -22);
        ctx.stroke();

        const rightLeaves = [
          { lx: 10, ly: 3, ang: -0.3, s: 1 },
          { lx: 18, ly: -6, ang: -1.1, s: 0.95 },
          { lx: 22, ly: -10, ang: -0.2, s: 0.9 },
          { lx: 29, ly: -17, ang: -1.0, s: 0.8 },
          { lx: 34, ly: -22, ang: -0.5, s: 0.75 }
        ];
        rightLeaves.forEach((lf) => {
          ctx.save();
          ctx.translate(lf.lx, lf.ly);
          ctx.rotate(lf.ang);
          ctx.scale(lf.s, lf.s);
          ctx.fillStyle = 'rgba(108, 148, 102, 0.78)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(6, -5, 14, 0);
          ctx.quadraticCurveTo(6, 5, 0, 0);
          ctx.fill();
          ctx.restore();
        });

        // Sol dal ve minyatür laleler
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.quadraticCurveTo(-12, -2, -24, -18);
        ctx.stroke();

        const miniTulips = [
          { dx: -11, dy: 0, ang: -0.5, c: 'rgba(232, 112, 148, 0.88)' },
          { dx: -17, dy: -9, ang: -0.6, c: 'rgba(182, 128, 212, 0.88)' },
          { dx: -24, dy: -18, ang: -0.7, c: 'rgba(238, 98, 118, 0.88)' }
        ];
        miniTulips.forEach((mt) => {
          ctx.save();
          ctx.translate(mt.dx, mt.dy);
          ctx.rotate(mt.ang);
          ctx.fillStyle = mt.c;
          ctx.beginPath();
          ctx.moveTo(0, 3);
          ctx.bezierCurveTo(-4, 2, -4, -4, -2, -5);
          ctx.lineTo(0, -3);
          ctx.lineTo(2, -5);
          ctx.bezierCurveTo(4, -4, 4, 2, 0, 3);
          ctx.fill();
          ctx.restore();
        });

        // Merkez dal ve minyatür zambak/lale goncaları
        ctx.beginPath();
        ctx.moveTo(0, 16);
        ctx.quadraticCurveTo(-2, -10, 4, -36);
        ctx.stroke();

        const bells = [
          { bx: -5, by: -12, ang: -0.4 },
          { bx: 6,  by: -18, ang: 0.4 },
          { bx: -4, by: -26, ang: -0.35 },
          { bx: 6,  by: -32, ang: 0.35 },
          { bx: 2,  by: -38, ang: 0 }
        ];
        bells.forEach((b) => {
          ctx.save();
          ctx.translate(b.bx, b.by);
          ctx.rotate(b.ang);
          ctx.fillStyle = 'rgba(228, 122, 162, 0.88)';
          ctx.beginPath();
          ctx.moveTo(0, 4);
          ctx.bezierCurveTo(-4.5, 2, -4.5, -3, -2.5, -5);
          ctx.lineTo(0, -3);
          ctx.lineTo(2.5, -5);
          ctx.bezierCurveTo(4.5, -3, 4.5, 2, 0, 4);
          ctx.fill();
          ctx.restore();
        });

        // Dalın altındaki küçük pembe suluboya Lilium yıldızı
        ctx.save();
        ctx.translate(0, 14);
        for (let p = 0; p < 6; p++) {
          ctx.save();
          ctx.rotate((p / 6) * Math.PI * 2);
          ctx.fillStyle = 'rgba(228, 112, 148, 0.88)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-2.2, -4, 0, -7.5);
          ctx.quadraticCurveTo(2.2, -4, 0, 0);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = '#d47424';
        ctx.beginPath();
        ctx.arc(0, 0, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      function drawWaxSeal(ctx, x, y, radius, half = 'full') {
        ctx.save();
        ctx.translate(x, y);
        if (half === 'top') {
          ctx.beginPath();
          ctx.rect(-radius * 1.4, -radius * 1.4, radius * 2.8, radius * 1.4);
          ctx.clip();
        } else if (half === 'bottom') {
          ctx.beginPath();
          ctx.rect(-radius * 1.4, 0, radius * 2.8, radius * 1.4);
          ctx.clip();
        }

        const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, radius);
        grad.addColorStop(0, '#b59ec2');
        grad.addColorStop(0.65, '#967ea4');
        grad.addColorStop(1, '#755d84');

        ctx.fillStyle = grad;
        ctx.beginPath();
        const steps = 24;
        for (let i = 0; i <= steps; i++) {
          const a = (i / steps) * Math.PI * 2;
          const r = radius * (0.96 + Math.sin(i * 5) * 0.04);
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(92, 70, 108, 0.65)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.68, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(235, 220, 245, 0.45)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.arc(-0.5, -0.5, radius * 0.68, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      function drawEnvelopeAndLetter(elapsed) {
        if (elapsed > 3.6) return;

        const envAlpha = elapsed < 2.8 ? 1 : Math.max(0, 1 - (elapsed - 2.8) / 0.8);
        ctx.save();
        ctx.globalAlpha = envAlpha;

        const cx = width * 0.5;
        const cy = height * 0.5;
        const envW = Math.min(width * 0.62, 236);
        const envH = envW * 0.70;
        const left = cx - envW / 2;
        const right = cx + envW / 2;
        const top = cy - envH / 2;
        const bottom = cy + envH / 2;

        const idleFloat = state === 'IDLE' ? Math.sin(performance.now() * 0.0025) * 3.5 : 0;
        ctx.translate(0, idleFloat);

        const flapProg = state === 'IDLE' ? 0 : Math.min(1, elapsed / 0.72);
        const easeFlap = 1 - Math.pow(1 - flapProg, 3);

        const letterProg = state === 'IDLE' ? 0 : Math.min(1, Math.max(0, (elapsed - 0.32) / 0.82));
        const easeLetter = 1 - Math.pow(1 - letterProg, 3);

        // Hafif zarf gölgesi
        ctx.fillStyle = 'rgba(120, 102, 78, 0.14)';
        ctx.beginPath();
        ctx.roundRect(left + 3, top + 6, envW, envH, 5);
        ctx.fill();

        // 1) Zarf Arka İç Yüzeyi
        ctx.fillStyle = '#d8c5a8';
        ctx.beginPath();
        ctx.roundRect(left, top, envW, envH, 4);
        ctx.fill();

        // 2) Açık Üçgen Kapak
        const flapTipClosedY = cy + envH * 0.16;
        const flapTipOpenY = top - envH * 0.54;
        const currentFlapTipY = flapTipClosedY + (flapTipOpenY - flapTipClosedY) * easeFlap;

        if (easeFlap > 0.48) {
          ctx.save();
          const openFlapGrad = ctx.createLinearGradient(cx, top, cx, currentFlapTipY);
          openFlapGrad.addColorStop(0, '#dfcfb6');
          openFlapGrad.addColorStop(1, '#ece0cc');
          ctx.fillStyle = openFlapGrad;

          ctx.beginPath();
          ctx.moveTo(left, top);
          ctx.quadraticCurveTo(cx - envW * 0.22, (top + currentFlapTipY) * 0.5, cx, currentFlapTipY);
          ctx.quadraticCurveTo(cx + envW * 0.22, (top + currentFlapTipY) * 0.5, right, top);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = 'rgba(168, 145, 115, 0.55)';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          drawWaxSeal(ctx, cx, currentFlapTipY + 12, 15, 'bottom');
          ctx.restore();
        }

        // 3) Zarfın İçinden Yükselen El Yazısı Mektup Kartı (Sadece "Bora'dan Petek'e")
        if (easeLetter > 0.01) {
          const cardW = envW * 0.88;
          const cardH = envH * 0.92;
          const cardX = cx - cardW / 2;
          const cardY = top - easeLetter * (envH * 0.32) + 8;

          ctx.save();
          const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
          cardGrad.addColorStop(0, '#f7f2e7');
          cardGrad.addColorStop(1, '#e8dcc8');
          ctx.fillStyle = cardGrad;

          ctx.beginPath();
          ctx.roundRect(cardX, cardY, cardW, cardH, 3);
          ctx.fill();

          ctx.strokeStyle = 'rgba(175, 152, 122, 0.48)';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = 'rgba(125, 108, 88, 0.78)';
          ctx.font = `italic ${Math.round(envW * 0.078)}px "Dancing Script", "Cormorant Garamond", serif`;
          ctx.textAlign = 'center';
          ctx.fillText("Bora'dan Petek'e", cx, cardY + 32);

          drawBotanicalSprig(ctx, cx, cardY + 84, envW / 230);
          ctx.restore();
        }

        // 4) Zarfın Sol, Sağ ve Alt Katlama Kanatları
        const sideGradL = ctx.createLinearGradient(left, cy, cx, cy);
        sideGradL.addColorStop(0, '#dfd0b8');
        sideGradL.addColorStop(1, '#d2be9f');
        ctx.fillStyle = sideGradL;
        ctx.beginPath();
        ctx.moveTo(left, top);
        ctx.lineTo(cx, cy + envH * 0.08);
        ctx.lineTo(left, bottom);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(162, 138, 108, 0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();

        const sideGradR = ctx.createLinearGradient(right, cy, cx, cy);
        sideGradR.addColorStop(0, '#dfd0b8');
        sideGradR.addColorStop(1, '#d2be9f');
        ctx.fillStyle = sideGradR;
        ctx.beginPath();
        ctx.moveTo(right, top);
        ctx.lineTo(cx, cy + envH * 0.08);
        ctx.lineTo(right, bottom);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const botGrad = ctx.createLinearGradient(cx, cy, cx, bottom);
        botGrad.addColorStop(0, '#e8dac4');
        botGrad.addColorStop(1, '#d8c5a8');
        ctx.fillStyle = botGrad;
        ctx.beginPath();
        ctx.moveTo(left, bottom);
        ctx.quadraticCurveTo(cx - envW * 0.2, cy + envH * 0.02, cx, cy + envH * 0.02);
        ctx.quadraticCurveTo(cx + envW * 0.2, cy + envH * 0.02, right, bottom);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 5) Kapalı veya Açılmakta Olan Üst Kapak
        if (easeFlap <= 0.48) {
          ctx.save();
          const topFlapGrad = ctx.createLinearGradient(cx, top, cx, currentFlapTipY);
          topFlapGrad.addColorStop(0, '#efe5d4');
          topFlapGrad.addColorStop(1, '#dfd0b8');
          ctx.fillStyle = topFlapGrad;

          ctx.beginPath();
          ctx.moveTo(left, top);
          ctx.quadraticCurveTo(cx - envW * 0.22, (top + currentFlapTipY) * 0.55, cx, currentFlapTipY);
          ctx.quadraticCurveTo(cx + envW * 0.22, (top + currentFlapTipY) * 0.55, right, top);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(158, 134, 104, 0.55)';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          ctx.save();
          const verticalScale = Math.max(0.1, 1 - easeFlap * 1.9);
          ctx.translate(cx, top + (currentFlapTipY - top) * 0.62);
          ctx.scale(1, verticalScale);
          drawBotanicalSprig(ctx, 0, 0, envW / 235);
          ctx.restore();

          drawWaxSeal(ctx, cx, currentFlapTipY, 15, 'full');
          ctx.restore();
        } else {
          drawWaxSeal(ctx, cx, flapTipClosedY, 15, 'full');
        }

        ctx.restore();
      }

      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function render(now) {
        requestAnimationFrame(render);

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#f3efe2';
        ctx.fillRect(0, 0, width, height);

        const elapsed = state === 'PLAYING' ? (now - startTime) / 1000 : 0;

        drawEnvelopeAndLetter(elapsed);

        if (state === 'PLAYING') {
          for (let i = 0; i < bloomFlowers.length; i++) {
            const fl = bloomFlowers[i];
            if (elapsed < fl.appearDelay) continue;

            const growT = Math.min(1, (elapsed - fl.appearDelay) / 0.68);
            const easePos = easeOutCubic(growT);
            const easeScale = easeOutBack(growT);

            let fadeAlpha = Math.min(1, growT * 2.2);
            let fallOffsetY = 0;
            let fallOffsetX = 0;

            if (elapsed > fl.fadeOutDelay) {
              const fadeT = Math.min(1, (elapsed - fl.fadeOutDelay) / 1.65);
              fadeAlpha *= Math.pow(1 - fadeT, 1.6);
              fallOffsetY = fadeT * fadeT * fl.fallVy * 2.4;
              fallOffsetX = fadeT * fl.fallVx;
            }

            if (fadeAlpha <= 0.01) continue;

            const curX = fl.startX + (fl.targetX - fl.startX) * easePos + fallOffsetX + Math.sin(elapsed * 1.4 + fl.swayPhase) * 2.2;
            const curY = fl.startY + (fl.targetY - fl.startY) * easePos + fallOffsetY + Math.cos(elapsed * 1.2 + fl.swayPhase) * 2.2;
            const curSize = fl.size * Math.max(0, easeScale);
            const curRot = fl.rotation + elapsed * fl.rotSpeed;

            const spriteObj = flowerSprites[fl.spriteIdx];
            ctx.save();
            ctx.globalAlpha = fadeAlpha;
            ctx.translate(curX, curY);
            ctx.rotate(curRot);
            ctx.drawImage(spriteObj.canvas, -curSize / 2, -curSize / 2, curSize, curSize);
            ctx.restore();
          }

          if (elapsed > 6.65 && !outroShown) {
            outroShown = true;
            outroContainer.classList.add('visible');
          }
        }
      }

      let lastTap = 0;
      function triggerInteraction() {
        const now = performance.now();
        if (now - lastTap < 300) return;
        lastTap = now;

        const unlockPromise = ensureAudioUnlocked();

        if (state === 'IDLE') {
          state = 'PLAYING';
          startTime = now;
          tapHint.classList.add('hidden');
          if (unlockPromise) {
            unlockPromise.then(playEnvelopeMusic).catch(playEnvelopeMusic);
          } else {
            playEnvelopeMusic();
          }
        } else if (outroShown && (now - startTime) > 8500) {
          state = 'IDLE';
          outroShown = false;
          soundPlayed = false;
          outroContainer.classList.remove('visible');
          tapHint.classList.remove('hidden');
        }
      }

      window.addEventListener('touchstart', () => {
        triggerInteraction();
      }, { passive: true });

      window.addEventListener('touchend', () => {
        ensureAudioUnlocked().then(() => {
          if (state === 'PLAYING' && !soundPlayed) playEnvelopeMusic();
        });
      }, { passive: true });

      window.addEventListener('click', () => {
        triggerInteraction();
      });

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (flowerSprites.length === 0) {
          initFlowerSprites();
        }
        buildBloomFlowers();
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(render);
    })();
  </script>
</body>
